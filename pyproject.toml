[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evok"
version = "3.1.0a1"
authors = [
  { name="Martin Triska", email="triska@unipi.technology" },
  { name="Miroslav Ondra", email="bokula@unipi.technology" },
  { name="Patrik Kratochvil", email="kratochvil@unipi.technology" },
]
description = "Web service bridge for Unipi PLCs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    'tmodbus[async-serial] == 0.6.2',
    'tenacity >= 8.2.0, != 8.4.0',    # retry strategies of tmodbus
    'tornado == 6.5.10',
    'tornado-jsonrpc2 == 0.5',
    'jsonschema == 2.6.0',
    'pyyaml == 6.0.1',
    'aiomqtt >= 2.3',
]

[tool.setuptools]
package-dir = {"" = "src"}

# all packages of src, also evok.modbus; packages = ["evok"] did not include the subpackages
[tool.setuptools.packages.find]
where = ["src"]
include = ["evok*"]

[project.scripts]
evok = "evok.evok:run"

[project.urls]
"Homepage" = "https://github.com/UnipiTechnology/evok"
"Documentation" = "https://evok.readthedocs.io/"
"Bug Tracker" = "https://github.com/UnipiTechnology/evok/issues"

[project.optional-dependencies]
test = ['pytest', 'pytest-asyncio']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120               # as .flake8
target-version = "py312"

[tool.ruff.lint]
# pyflakes, the swallowed exceptions, the style and the modernization;
# the default rules of ruff change between its versions
select = ["F", "S110", "I", "UP", "C408", "EXE", "TRY401", "RUF013", "C400", "C402", "RUF010", "PLC0206", "RUF022", "PIE790", "C404", "PLR1730"]

[tool.ruff.lint.isort]
known-first-party = ["evok"]

  responses:
    Unauthorized:
      description: The token of the configuration is missing or invalid, see the security schemes
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="evok" and Basic realm="evok"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                success: false
                errors:
                  Unauthorized: Missing or invalid token
    Forbidden:
      description: The read_token of the configuration allows only reading, the device is not changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            read-only:
              value:
                success: false
                errors:
                  ReadOnlyAccess: The token allows only reading
    BadRequest:
      description: Invalid params or the value cannot be written
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid-param:
              value:
                success: false
                errors:
                  ValidationError: Additional properties are not allowed ('bogus' was unexpected)
            invalid-value:
              value:
                success: false
                errors:
                  ValueError: "Invalid boolean value 'high'"
    SequenceRunning:
      description: A sequence of the sequencer of the output runs, cancel it there first. The output is
        not changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sequence-running:
              value:
                success: false
                errors:
                  SequenceRunning: 'RO 2_01: a sequence of its sequencer ro_2_01 runs, cancel it there'
    ServerError:
      description: An internal error of Evok, the details are in its log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value:
                success: false
                errors:
                  Server error: internal
    Unavailable:
      description: The Modbus unit of the device failed its last scan, the device is not changed
        (UnitUnavailable), or a request of the change failed, the writes before it are done
        (UnitCommunicationError)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable-unit:
              value:
                success: false
                errors:
                  UnitUnavailable: "Unit TCP:127.0.0.1:1 is not available: RequestRetryFailedError: Failed to get
                    a valid response after 2 attempts"
    NotFound:
      description: Unknown device type, circuit, alias or property
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unknown-circuit:
              value:
                success: false
                errors:
                  DeviceNotFound: Circuit or alias '1_99' with devtype 'do' not found
            unknown-device-type:
              value:
                success: false
                errors:
                  DeviceNotFound: Invalid device type 'foo'
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: The token of apis in the configuration of Evok, required only when it is set;
        the read_token allows only reading, a POST with it is refused with 403
    basicToken:
      type: http
      scheme: basic
      description: Any user name and the token of apis in the configuration of Evok as the password
  parameters:
    format:
      name: format
      description: Content type - use "json" for application/json OR "rest" for text/html
      in: path
      required: true
      schema:
        type: string
        examples: [json]
        enum:
          - json
          - rest
        default: json
    device_type:
      name: device_type
      description: 'Device type, one of: ro, do, di, ai, ao, led, watchdog, register, data_point, modbus_slave,
        device_info, serial_bus, tcp_bus, owpower, nv_save, sequencer, owbus, sensor (the 1-Wire devices), run
        (the aliases, circuit alias). Altnames: relay = ro; output, digitaloutput = do; input, digitalinput = di;
        analoginput = ai; analogoutput = ao; wd = watchdog; temp, 1wdevice = sensor. An unknown type is 404.'
      in: path
      required: true
      schema:
        type: string
        examples: [ai, ao, di, do, ro, wd, led, temp]
tags:
  - name: General
    description: Other commands not directly couped with any specific device type
  - name: Getter
    description: Superclass of a getter ()
  - name: Setter
    description: Superclass of a setter ()
  - name: Analog input
    description: Superclass of analog inputs ()
  - name: Analog output
    description: Superclass of analog outputs ()
  - name: Digital input
    description: Superclass of binary inputs ()
  - name: Digital output
    description: 'Superclass of all binary outputs (push-pull, open-collector, ...)'
  - name: Relay output
    description: Superclass of relay outputs ()
  - name: User LED
    description: Superclass of user LED
  - name: Master Watchdog
    description: Superclass of watchdog timer
  - name: 1-Wire bus
    description: Classes coupled with OneWire bus implementation
  - name: Modbus register
    description: User-defined Modbus maps
  - name: Data point
    description: Superclass of Data point.
  - name: Device info
    description: Superclass of Device info.
  - name: Modbus slave
    description: Information about modbus slave (last_comm, modbus_spec, scan_interval, ...)
  - name: Sequencer
    description: Pulses and sequences of the outputs (RO, DO, LED) timed by Evok.
  - name: Modbus bus
    description: Configuration of a Modbus RTU or TCP bus and its Modbus devices, read-only.
  - name: Non-volatile memory
    description: Device for manage save Non-volatile memory.
  - name: Aliases
    description: Superclass of all stuff related to aliases


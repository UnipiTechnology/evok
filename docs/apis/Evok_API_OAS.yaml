openapi: 3.1.0
x-stoplight:
  id: ilvxmjda44vjf
info:
  title: Evok
  summary: A web services API for Unipi products
  description: |
    ### <i class="fa-light fa-cubes"></i> Welcome to Evok REST API documentation <i class="fa-light fa-cubes">

    This specification describes the REST API (the paths /rest/... and /json/...). The other APIs of Evok,
    /bulk (several reads and writes in one request), /rpc (JSON-RPC) and /ws (WebSocket), are documented in
    the pages [Bulk](https://evok.readthedocs.io/en/stable/apis/bulk/),
    [RPC](https://evok.readthedocs.io/en/stable/apis/rpc/) and
    [WebSocket](https://evok.readthedocs.io/en/stable/apis/websocket/) (docs/apis/bulk.md, rpc.md and
    websocket.md in the repository).
  contact:
    name: Evok support
    email: support@unipi.technology
    url: 'https://github.com/UnipiTechnology/evok'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
  version: 3.1.0
  termsOfService: 'https://evok.readthedocs.io/'
servers:
  - url: 'http://{unipi_device}:{port}'
    description: Remote Unipi device
    variables:
      port:
        default: '8080'
        description: TCP port on what API listen on. Can be modified in the config file.
      unipi_device:
        default: 192.168.1.2
        description: IP adress or hostname of your Unipi device
  - url: 'http://127.0.0.1:{port}'
    description: Localhost
    variables:
      port:
        default: '8080'
        description: TCP port on what API listen on. Can be modified in the config file.
# the token is required only when it is set in the configuration, {} is a request without it
security:
  - {}
  - bearerToken: []
  - basicToken: []
paths:
  /{format}/all:
    parameters:
      - name: format
        in: path
        required: true
        schema:
          type: string
          examples: [json]
          enum:
            - json
            - rest
          default: json
        description: Content type - use "json" for application/json OR "rest" for text/html.
    get:
      summary: Get all circuits
      responses:
        '200':
          description: Current data snapshot of all circuits in the system.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  x-stoplight:
                    id: an1ebotaei10u
                  type: object
                  properties:
                    circuit:
                      type: string
                      x-stoplight:
                        id: lqgteta92hqs6
                    dev:
                      type: string
                      x-stoplight:
                        id: xha9b9v3qscbv
              examples:
                S167:
                  value:
                    - dev: di
                      circuit: '1_01'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_02'
                      value: 0
                      debounce: 50
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_03'
                      value: 0
                      debounce: 50
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_04'
                      value: 0
                      debounce: 50
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: do
                      circuit: '1_01'
                      value: 0
                      mode: Simple
                      modes:
                        - Simple
                        - PWM
                      pwm_freq: 39.0625
                      pwm_duty: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: do
                      circuit: '1_02'
                      value: 0
                      mode: Simple
                      modes:
                        - Simple
                        - PWM
                      pwm_freq: 39.0625
                      pwm_duty: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: do
                      circuit: '1_03'
                      value: 0
                      mode: Simple
                      modes:
                        - Simple
                        - PWM
                      pwm_freq: 39.0625
                      pwm_duty: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: do
                      circuit: '1_04'
                      value: 0
                      mode: Simple
                      modes:
                        - Simple
                        - PWM
                      pwm_freq: 39.0625
                      pwm_duty: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: ai
                      circuit: '1_01'
                      value: 0.013
                      unit: V
                      mode: Voltage
                      modes:
                        Voltage:
                          unit: V
                          range:
                            - 0
                            - 10
                        Current:
                          unit: mA
                          range:
                            - 0
                            - 20
                      range: [0, 10]
                      comm: ok
                      last_comm: 0.041
                    - dev: ao
                      circuit: '1_01'
                      mode: Voltage
                      modes:
                        Voltage:
                          unit: V
                          range:
                            - 0
                            - 10
                        Current:
                          unit: mA
                          range:
                            - 0
                            - 20
                        Resistance:
                          unit: Ohm
                          range:
                            - 0
                            - 2000
                      unit: V
                      value: 0
                      range: [0, 10]
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_01'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_02'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_03'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_04'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: wd
                      circuit: '1'
                      value: 0
                      timeout: 5000
                      was_wd_reset: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: modbus_slave
                      circuit: '1'
                      modbus_spec: "127.0.0.1"
                      scan_interval: 0.02
                      scan_enabled: true
                      last_comm: 0.021920204162597656
                      slave_id: 1
                      modbus_type: TCP
                      scan_error: null
                      comm: ok
                    - dev: owpower
                      circuit: '1'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: device_info
                      family: Patron
                      model: S167
                      sn: 667
                      board_count: 1
                      circuit: Patron_S167_667
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: get-all-circuits
      description: Retrieve the full information dump of all circuits inside the system - the states of the
        devices of the types di, ro, do, ai, ao, sensor (temp), led, watchdog, modbus_slave, owpower, nv_save,
        register, data_point, owbus and device_info. It leaves out serial_bus, tcp_bus, sequencer and run (the
        aliases), read them by /{format}/{device_type}/all.
      x-stoplight:
        id: m7p89alenp2u3
      tags:
        - General
  '/{format}/{device_type}/all':
    parameters:
      - name: format
        in: path
        required: true
        schema:
          type: string
          examples: [json]
          enum:
            - json
            - rest
          default: json
        description: Content type - use "json" for application/json OR "rest" for text/html.
      - $ref: '#/components/parameters/device_type'
    get:
      summary: Get all circuits of device type
      description: Read all devices of the same type present in the whole system.
      tags:
        - General
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  type: object
                  x-stoplight:
                    id: rnn7b379iocrf
              examples:
                LED:
                  value:
                    - dev: led
                      circuit: '1_01'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_02'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_03'
                      value: 0
                      comm: ok
                      last_comm: 0.041
                    - dev: led
                      circuit: '1_04'
                      value: 0
                      comm: ok
                      last_comm: 0.041
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get-format-device-all
      x-stoplight:
        id: 2a8zh84up8mp4
  '/{format}/{device_type}/{circuit}/{parameter}':
    get:
      summary: Read specify parameter from specify device_type.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'The parameter of one device, {"<parameter>": <its value>}'
                    minProperties: 1
                    maxProperties: 1
                    additionalProperties: true
                  - type: array
                    description: With the circuit "all" the parameter of all devices of the type, the devices
                      without the parameter are skipped
                    items:
                      type: object
                      properties:
                        circuit:
                          type: string
                      additionalProperties: true
              examples:
                one:
                  value:
                    value: 0
                all:
                  value:
                    - circuit: '1_01'
                      value: 0
                    - circuit: '1_02'
                      value: 1
            text/html:
              schema:
                oneOf:
                  - type: object
                    description: 'The parameter of one device, {"<parameter>": <its value>}'
                    minProperties: 1
                    maxProperties: 1
                    additionalProperties: true
                  - type: array
                    description: With the circuit "all" the parameter of all devices of the type, the devices
                      without the parameter are skipped
                    items:
                      type: object
                      properties:
                        circuit:
                          type: string
                      additionalProperties: true
              examples:
                one:
                  value:
                    value: 0
                all:
                  value:
                    - circuit: '1_01'
                      value: 0
                    - circuit: '1_02'
                      value: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Retrieve a parameter (a property of the state, e.g. value, mode or alias) of one device,
                   or with the circuit "all" of all devices of the type. The value has the type of the property
                   in the state of the device. An unknown parameter is 404, with "all" only when no device of
                   the type has it.
                   This is commonly used to quickly obtain the value without requiring additional data.
                   **It's recommended to use this endpoint as getter in most applications.**
      operationId: read-input-object-parameter
      x-stoplight:
        id: ulh6qg2h9b0ue
      tags:
        - General
    parameters:
      - schema:
          type: string
          examples: ['1_01', '1_02', '2_01', 'all']
        name: circuit
        in: path
        required: true
        description: Device circuit (or "all"). You can learn more about the circuit parameter in [documentation](https://evok.readthedocs.io/en/stable/circuit/).
      - $ref: '#/components/parameters/format'
      - schema:
          type: string
          examples: ['value', 'alias']
          default: 'value'
        name: parameter
        in: path
        required: true
        description: Name of retrieved parameter
      - $ref: '#/components/parameters/device_type'
  /version:
    get:
      summary: Get version
      description: Read Evok version, also without the token of the configuration
      tags:
        - General
      responses:
        '200':
          description: OK
          content:
            text/html:
              examples:
                version:
                  value: "v3.1.0"
      # for monitoring, the token is not required
      security:
        - {}
      operationId: get-version
      x-stoplight:
        id: pnta60tkpt5qz
  /log:
    get:
      summary: Get log
      description: Read the last lines of the Evok log file. Available only when logging to a file is configured.
      tags:
        - General
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 255
          name: lines
          in: query
          required: false
          description: Number of lines from the end of the log, values out of range are clamped
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                log:
                  value: "2026-10-06 12:00:00,000 - evok - INFO - Starting Evok\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid number of lines
        '404':
          description: Logging to a file is not configured
      operationId: get-log
  '/{format}/di/{circuit}':

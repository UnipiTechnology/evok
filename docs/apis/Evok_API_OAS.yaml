              $ref: '#/components/schemas/Data_point_params'
      description: |
        Write the value of a data point. Only a data point with `writable: true` in the hardware definition
        in a holding register can be written, other data points are read-only.
        The value is converted to the register by the inverse of the transformation of the data point,
        `(value - offset) / factor`, integer datatypes are rounded and checked against their range.
      operationId: write-data_point-object
      tags:
        - Data point
        - Setter

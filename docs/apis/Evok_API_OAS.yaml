  '/{format}/sequencer/{circuit}':
    get:
      summary: Read the sequencer of an output
      description: The running pulse or sequence of an output (RO, DO, LED). The circuit is the type and the circuit of the output, e.g. `do_1_01`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Sequencer'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Sequencer'
              examples:
                pulse:
                  value:
                    dev: sequencer
                    circuit: do_1_01
                    output: {dev: do, circuit: '1_01'}
                    running: true
                    name: pulse
                    step: 0
                    steps: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: read-sequencer-object
      tags:
        - Sequencer
        - Getter
    parameters:
      - schema:
          type: string
          examples: ['do_1_01']
        name: circuit
        in: path
        required: true
        description: The type and the circuit of the output (or "all"), e.g. `ro_2_01`, `led_1_02`.
      - name: format
        in: path
        required: true
        schema:
          type: string
          examples: [json]
          enum:
            - json
            - rest
          default: json
        description: Content type - use "json" for application/json OR "rest" for text/html.
    post:
      summary: Start a pulse or a sequence of an output
      description: >-
        One of: *value* with *pulse_duration* sets the value of the output for a pulse; *steps* (and *final*)
        run a sequence of changes of the output; *cancel* stops the running sequence without its final state.
        While a sequence runs, a change of the output itself is refused with 409.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: '#/components/schemas/Status'
                  result:
                    $ref: '#/components/schemas/Sequencer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post-rest-sequencer-circuit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sequencer_params'
            examples:
              pulse:
                value: {value: 1, pulse_duration: 2}
              sequence:
                value:
                  steps:
                    - {value: 1}
                    - {delay: 0.5, value: 0}
                    - {delay: 0.5, value: 1}
                  final: {value: 0}
              cancel:
                value: {cancel: true}
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sequencer_params'
      tags:
        - Sequencer
        - Setter

                    dev: di
                    circuit: '1_01'
                    value: 0
                    debounce: 30
                    counter_modes:
                      - Enabled
                      - Disabled
                    counter_mode: Enabled
                    counter: 0
                    mode: Simple
                    modes:
                      - Simple
                      - DirectSwitch
                    comm: ok
                    last_comm: 0.041
                all:
                  value:
                    - dev: di
                      circuit: '1_01'
                      value: 0
                      debounce: 30
                      counter_modes:

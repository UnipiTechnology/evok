                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_03'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_04'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Digital_input'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Digital_input'
              examples:
                1_01:
                  value:
                    dev: di
                    circuit: '1_01'
                    value: 0
                    debounce: 30
                    counter_modes:
                      - Enabled
                      - Disabled
                    counter_mode: Enabled
                    counter: 0
                    mode: Simple
                    modes:
                      - Simple
                      - DirectSwitch
                    comm: ok
                    last_comm: 0.041
                all:
                  value:
                    - dev: di
                      circuit: '1_01'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_02'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_03'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
                    - dev: di
                      circuit: '1_04'
                      value: 0
                      debounce: 30
                      counter_modes:
                        - Enabled
                        - Disabled
                      counter_mode: Enabled
                      counter: 0
                      mode: Simple
                      modes:
                        - Simple
                        - DirectSwitch
                      comm: ok
                      last_comm: 0.041
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-stoplight:
        id: amptpwemaf9og
      description: Get all properties of single (or all) digital input including current value and parameters.
      operationId: read-input-object
    parameters:
      - schema:
          type: string
          examples: ['1_01', '1_02', '1_03', '1_04', 'all']
        name: circuit
        in: path
        required: true
        description: Device circuit (or "all"). You can learn more about the circuit parameter in [documentation](https://evok.readthedocs.io/en/stable/circuit/).
      - name: format
        in: path
        required: true
        schema:
          type: string
          examples: [json]
          enum:
            - json
            - rest
          default: json
        description: Content type - use "json" for application/json OR "rest" for text/html.
    post:
      summary: Set digital input properties
      tags:
        - Digital input
        - Setter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    $ref: '#/components/schemas/Status'
                  result:
                    $ref: '#/components/schemas/Digital_input'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: post-rest-input-circuit
      x-stoplight:
        id: 3qe4b8bqygqvu
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Digital_input_params'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Digital_input_params'
      description: Set one or more parameters related to any single digital input.
  '/{format}/owpower/{circuit}':
    get:
      summary: Read 1-Wire power supply driver
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Owpower'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Owpower'
              examples:
                1:
                  value:
                    dev: owpower
                    circuit: '1'
                    value: 0
                    comm: ok
                    last_comm: 0.041
                all:
                  value:
                    - dev: owpower
                      circuit: '1'
                      value: 0
                      comm: ok
                      last_comm: 0.041
            application/json:
              schema:
                anyOf:

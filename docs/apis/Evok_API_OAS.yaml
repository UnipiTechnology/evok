                    - dev: owbus
                      circuit: OWBUS
                      bus: OWFS
                      master: w1_bus_master1
                      scan_interval: 60
                      interval: 10
                      do_scan: false
                      do_reset: false
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Owbus'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Owbus'
              examples:
                OWBUS:
                  value:
                    dev: owbus
                    circuit: OWBUS
                    bus: OWFS
                    master: w1_bus_master1
                    scan_interval: 60
                    interval: 10
                    do_scan: false
                    do_reset: false
                all:
                  value:
                    - dev: owbus
                      circuit: OWBUS
                      bus: OWFS
                      master: w1_bus_master1
                      scan_interval: 60
                      interval: 10
                      do_scan: false
                      do_reset: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Get all properties of 1Wire bus driver.
      operationId: read-owbus-object
      tags:
        - 1-Wire bus
        - Getter
      x-stoplight:
        id: 8dmow7nxxtutd
    parameters:
      - schema:
          type: string
          examples: ['1']
        name: circuit
        in: path
        required: true
        description: Device circuit (or "all"). You can learn more about the circuit parameter in [documentation](https://evok.readthedocs.io/en/stable/circuit/).
      - name: format
        in: path
        required: true
        schema:
          type: string
          examples: [json]
          enum:
            - json
            - rest
          default: json
        description: Content type - use "json" for application/json OR "rest" for text/html.
    post:
      summary: Set 1-Wire properties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:

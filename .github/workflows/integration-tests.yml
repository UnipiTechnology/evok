name: integration-tests

# CI gate for the Evok black-box integration & regression harness.
# See tests/integration/README.md for the harness architecture.
#
# Two jobs, both hardware-free:
#   * replay     — offline: serves golden cassettes, validates against the
#                  spec-derived oracles. Catches drift in tests/spec/oracles.
#   * functional — starts the real evok against the mockbus (fake Modbus PLC)
#                  + a fake owserver (1-Wire DS18B20), then runs the harness
#                  as a black-box client. Exercises the full server stack.
#
# Lint lives in .github/workflows/lint.yml (split by harness vs evok ownership).
#
# Device-dependent modes (compare / record) are NEVER run in CI — there is no
# hardware plumbed in here. Run them locally against a device:
#   EVOK_TEST_MODE=compare EVOK_BASE_URL=... uv run pytest
#   EVOK_TEST_MODE=record  EVOK_BASE_URL=... uv run pytest

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'tests/integration/**'
      - 'evok/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/integration-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: replay (offline test gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/integration/uv.lock'

      - name: uv.lock is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: spec.json is up to date
        # The spec is generated from the golden cassettes and is the offline CI
        # oracle. Fail if a cassette changed without regenerating it.
        run: uv run python tools/extract_spec_from_cassettes.py --check

      - name: Run harness (replay)
        env:
          EVOK_TEST_MODE: replay
        run: uv run pytest -ra

  functional:
    name: functional (mockbus-backed evok)
    runs-on: ubuntu-latest
    # Exercises the real evok server against the mockbus (fake Modbus PLC) and
    # a fake owserver (1-Wire DS18B20) — no hardware. The launcher starts all
    # three (mockbus:5020, owserver:4304, evok:8090); the harness then connects
    # as a black-box client. See tests/integration/mockbus/README.md.
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            tests/integration/uv.lock

      - name: Sync main project (evok + asyncowfs)
        working-directory: .
        run: uv sync --frozen

      - name: Sync harness
        run: uv sync --frozen

      - name: Start mockbus + owserver + evok
        # Background the launcher; it stays alive serving on :8090. The harness
        # connects in the next step. Teardown is implicit (job runner reaps).
        run: |
          uv run python mockbus/start.py > /tmp/evok.log 2>&1 &
          echo $! > /tmp/launcher.pid

      - name: Wait for evok readiness
        run: |
          # Poll /rest/all until evok responds (board scan + 1-Wire scan take a
          # few seconds). Timeout after 60s.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8090/rest/all/ > /dev/null 2>&1; then
              echo "evok ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "evok did not become ready; launcher log:"
          cat /tmp/evok.log
          exit 1

      - name: Run harness (functional)
        env:
          EVOK_TEST_MODE: functional
          EVOK_BASE_URL: http://127.0.0.1:8090
        run: uv run pytest -ra

      - name: Upload launcher log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: functional-launcher-log-${{ github.run_id }}
          path: /tmp/evok.log
          if-no-files-found: ignore

      - name: Stop launcher
        if: always()
        run: |
          if [ -f /tmp/launcher.pid ]; then
            kill "$(cat /tmp/launcher.pid)" 2>/dev/null || true
          fi

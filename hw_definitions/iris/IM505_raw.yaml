---
# IRIS Card ID-AiUC8-2
modbus_register_blocks:
    - board_index : 1
      start_reg   : 0
      count       : 17
      frequency   : 1
    - board_index : 1
      start_reg   : 1000
      count       : 18
      frequency   : 10
modbus_features:
    - type        : AI
      count       : 8
      modes       :
        Voltage:
          value: 0
          unit: 'N/A'
          range: [0, 262140]
          transformation:
            datatype: uint32
        Current:
          value: 1
          unit: 'N/A'
          range: [0, 262140]
          transformation:
            datatype: uint32
      val_reg     : 0
      mode_reg    : 1010

    - type        : WD
      count       : 1
      val_reg     : 16
      timeout_reg : 1008
      nv_sav_coil : 1003
      reset_coil  : 1002

  # Non-volatile memory saver
    - type: NV_SAVE
      val_coil: 1003

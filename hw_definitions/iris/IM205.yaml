---
# IRIS Card ID-Do16-1
modbus_register_blocks:
    - board_index : 1
      start_reg   : 0
      count       : 18
      frequency   : 1
    - board_index : 1
      start_reg   : 1000
      count       : 12
      frequency   : 10
modbus_features:
    - type        : DO
      count       : 16
      modes       :
        - Simple
        - PWM
      val_reg     : 0
      val_coil    : 0
      pwm_reg     : 2
      pwm_preset_reg : 1010
      pwm_cpres_reg  : 1011
    - type        : WD
      count       : 1
      val_reg     : 1
      timeout_reg : 1008
      nv_sav_coil : 1003
      reset_coil  : 1002

  # Non-volatile memory saver
    - type: NV_SAVE
      val_coil: 1003

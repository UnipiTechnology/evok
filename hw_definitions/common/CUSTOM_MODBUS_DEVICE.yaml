# Custom device XY
# File version: 1.0
# Min. firmware version: 0.1
---
# This key defines which Modbus registers will be periodically read. Each block (also sometimes referred to as "group") is read once every ["scan_divider"] read cycles
modbus_register_blocks:
    - start_reg   : 0
      count       : 10
      scan_divider: 1

    - start_reg   : 500
      count       : 8
      scan_divider: 10

    - start_reg   : 508
      count       : 8
      scan_divider: 50

# This defines the devices mapped to the registers above. As custom devices are very unlikely to support any Neuron features, the devices should be "DATA_POINT"s; datatype uint16 is the raw register, writable: true allows its writing (a holding register)
modbus_features:
    - type        : DATA_POINT
      count       : 10
      value_reg   : 0
      datatype    : uint16
      writable    : true

    - type        : DATA_POINT
      count       : 8
      value_reg   : 500
      datatype    : uint16
      writable    : true

    - type        : DATA_POINT
      count       : 8
      value_reg   : 508
      datatype    : uint16
      writable    : true

modbus_register_blocks:
  # DI, DO / 20ms
  - start_reg   : 0
    count       : 2
    scan_divider: 1

  # MWD status, CNT, PWM / 1s
  - start_reg   : 2
    count       : 11
    scan_divider: 50

  # Configuation / 5s
  - start_reg   : 1008
    count       : 11
    scan_divider: 250

  # ULED / 300 ms
  - start_reg   : 3998
    count       : 2
    scan_divider: 15

modbus_features:
  - type        : DI
    count       : 4
    modes       :
      - Simple
      - DirectSwitch
    ds_modes    :
      - Simple
      - Inverted
      - Toggle
    val_reg     : 0
    counter_reg : 3
    deboun_reg  : 1010
    direct_reg  : 1014
    polar_reg   : 1015
    toggle_reg  : 1016

  - type        : DO
    count       : 2
    modes       :
      - Simple
      - PWM
    val_reg     : 1
    val_coil    : 0
    pwm_reg     : 11
    pwm_ps_reg  : 1017
    pwm_c_reg   : 1018

  - type        : WD
    count       : 1
    val_reg     : 2
    timeout_reg : 1008
    nv_sav_coil : 1003
    reset_coil  : 1002

  - type        : NV_SAVE
    val_coil    : 1003

  - type        : LED
    count       : 3
    val_coil    : 3000
    val_reg     : 3998

